# CI static-analysis gate — runs on every PR and push to main.
#
# Design notes (see also docs/adr/):
# - Fully OFFLINE: no cloud credentials, no terraform plan here. The plan-in-CI
#   job (build PR #11) is a separate workflow so badge-greenness never depends
#   on a private AWS account and forks can run this safely.
# - tfsec was archived by Aqua in favour of `trivy config` — we use Trivy
#   deliberately rather than cargo-culting the dead binary.
# - Checkov hard-fails on HIGH+ severity; narrow inline skips only, each with
#   a written justification (never blanket --soft-fail).
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # OpenTofu, not Terraform — see docs/adr/0004-opentofu-vs-terraform.md.
  # Config stays Terraform-compatible; only the CLI CI runs differs.
  TOFU_VERSION: "1.12.5"

jobs:
  fmt-and-validate:
    name: tofu fmt + validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: opentofu/setup-opentofu@v2.0.2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}

      - name: tofu fmt (check only)
        run: tofu fmt -check -recursive -diff

      - name: tofu validate (every module)
        run: |
          set -euo pipefail
          for dir in modules/*/; do
            echo "::group::validate ${dir}"
            tofu -chdir="${dir}" init -backend=false -input=false >/dev/null
            tofu -chdir="${dir}" validate
            echo "::endgroup::"
          done

  module-tests:
    name: tofu test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: opentofu/setup-opentofu@v2.0.2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}

      # Tests use `command = plan`, so they assert config logic with no credentials,
      # no real infrastructure, and no cost. Skips modules that have no tests yet.
      - name: tofu test (every module with tests/)
        run: |
          set -euo pipefail
          found=0
          for dir in modules/*/; do
            if compgen -G "${dir}tests/*.tftest.hcl" >/dev/null; then
              found=1
              echo "::group::test ${dir}"
              tofu -chdir="${dir}" init -backend=false -input=false >/dev/null
              tofu -chdir="${dir}" test
              echo "::endgroup::"
            fi
          done
          [ "$found" -eq 1 ] || echo "No module tests found yet — nothing to run."

  tflint:
    name: tflint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.53.0

      - name: tflint (recursive)
        run: |
          tflint --init
          tflint --recursive --format=compact

  security-scan:
    name: trivy config + checkov
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Trivy misconfig scan (successor to tfsec). Fails on HIGH/CRITICAL.
      - name: trivy config
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"

      # Checkov: hard-fail on HIGH+. Inline `#checkov:skip=CKV_x:<reason>` only.
      - name: checkov
        uses: bridgecrewio/checkov-action@v12.1347.0
        with:
          directory: .
          framework: terraform
          quiet: true
          hard_fail_on: HIGH
